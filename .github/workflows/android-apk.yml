name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 requires Node >=22; bunx executes its Node CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK; setup-android@v3 fails on the obsolete "tools" package.
      # Match Capacitor 8's compile SDK and AGP 8.13 default build tools.
      - name: Install Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static web app (SPA mode)
        run: CAPACITOR=1 bun run build

      # Outside Lovable, nitro writes to .output/public instead of dist/client; normalize to
      # Capacitor's webDir, then render "/" from the server entry if no HTML page exists.
      - name: Prepare index.html for Capacitor
        run: |
          if [ ! -d dist/client ] && [ -d .output/public ]; then
            mkdir -p dist && cp -r .output/public dist/client && cp -r .output/server dist/server
          fi
          if [ ! -f dist/client/index.html ] && [ -f dist/client/_shell.html ]; then cp dist/client/_shell.html dist/client/index.html; fi
          if [ ! -f dist/client/index.html ]; then
            node --input-type=module -e '
              const m = await import(process.cwd() + "/dist/server/index.mjs");
              const h = m.default?.fetch ?? m.default;
              const r = await h(new Request("http://localhost/"), {}, { waitUntil() {}, passThroughOnException() {} });
              if (!r.ok) throw new Error("render failed: " + r.status);
              (await import("node:fs")).writeFileSync("dist/client/index.html", await r.text());
            '
          fi
          test -s dist/client/index.html
          ls dist/client

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then bunx cap add android; fi
          bunx cap sync android

      - name: Allow exact alarms & notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("android/app/src/main/AndroidManifest.xml")
          namespace = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", namespace)
          tree = ET.parse(path)
          root = tree.getroot()
          name = f"{{{namespace}}}name"
          existing = {element.get(name) for element in root.findall("uses-permission")}
          for permission in ("POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED"):
              value = f"android.permission.{permission}"
              if value not in existing:
                  root.insert(0, ET.Element("uses-permission", {name: value}))
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: hissi-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
